[project]
name = "customer-segmentation"
version = "1.0.0"
description = "RFM + K-Means customer segmentation of the UCI Online Retail dataset, served by FastAPI."
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pandas==2.2.3",
  "scikit-learn==1.5.2",
  "joblib==1.4.2",
  "openpyxl==3.1.5",
]

[dependency-groups]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/segmentation"]
